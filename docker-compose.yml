services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ragocr-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_pdfs:/app/pdfs
      - backend_chroma:/app/local_chroma_db
      - backend_media:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=ragocr.settings
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,ragocr-backend
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
      - OLLAMA_API_BASE=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ragocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/model/status/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragocr-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragocr-network
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
  backend_pdfs:
    driver: local
  backend_chroma:
    driver: local
  backend_media:
    driver: local

networks:
  ragocr-network:
    driver: bridge
