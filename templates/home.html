<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RagOcr | AI Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Modern Professional Palette (Slate/Blue) */
            --primary: #2563eb;
            /* Royal Blue */
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --secondary: #64748b;
            /* Slate 500 */
            --bg-body: #f1f5f9;
            /* Slate 100 */
            --bg-panel: #ffffff;
            --border: #e2e8f0;
            /* Slate 200 */
            --text-main: #0f172a;
            /* Slate 900 */
            --text-muted: #64748b;
            /* Slate 500 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        /* --- GLOBAL RESET & TYPOGRAPHY --- */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAVBAR --- */
        .navbar {
            height: 64px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.25rem;
            letter-spacing: -0.025em;
            z-index: 10;
        }

        .brand-icon {
            margin-right: 12px;
            color: var(--primary);
            font-size: 1.4rem;
            filter: drop-shadow(0 2px 4px rgba(37, 99, 235, 0.2));
        }

        /* --- LAYOUT --- */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: var(--bg-body);
        }

        /* --- SIDEBAR (THREADS) --- */
        .sidebar {
            width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .thread-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        /* Scrollbar Styling */
        .thread-list::-webkit-scrollbar {
            width: 6px;
        }

        .thread-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .thread-item {
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.925rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 4px;
            transition: all 0.2s ease;
            position: relative;
        }

        .thread-item:hover {
            background: var(--bg-body);
            color: var(--primary);
        }

        .thread-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .thread-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .sub-thread {
            margin-left: 24px;
            border-left: 2px solid var(--border);
            padding-left: 12px;
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* --- CHAT AREA --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.01);
        }

        .chat-header {
            height: 64px;
            padding: 0 30px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .chat-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .messages-box {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .ai .bubble {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .source-citation {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .source-item {
            display: inline-flex;
            align-items: center;
            background: var(--bg-body);
            padding: 4px 8px;
            border-radius: 6px;
            margin-right: 6px;
            margin-top: 4px;
            font-weight: 500;
            color: var(--text-main);
        }

        .input-area {
            padding: 24px 40px;
            border-top: 1px solid var(--border);
            background: white;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 16px 20px;
            border: 1px solid var(--border);
            border-radius: 30px;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg-body);
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .chat-input:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .chat-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* --- FILES PANEL --- */
        .files-panel {
            width: 320px;
            background: #fafafa;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .files-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-card {
            background: white;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .file-icon {
            color: #ef4444;
            font-size: 1.4rem;
        }

        .file-info {
            flex: 1;
            overflow: hidden;
        }

        .file-name {
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }

        .file-origin {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .inherited-tag {
            font-size: 0.7rem;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* --- BUTTONS & CONTROLS --- */
        .btn {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.4);
        }

        .btn-send {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            padding: 0;
            font-size: 1.1rem;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--primary);
        }

        .btn-delete:hover {
            background: #fee2e2;
            color: #ef4444 !important;
        }

        /* Hidden Input Fix from previous step */
        .hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
            opacity: 0;
        }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            /* Darker backdrop */
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 16px;
            width: 400px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .modal h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            font-size: 1.25rem;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: var(--primary);
            outline: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <i class="fa-solid fa-brain brand-icon"></i>
        <span>RagOcr <span
                style="font-weight:400; color:var(--text-muted); font-size:0.9rem; margin-left:8px;">Workspace</span></span>
    </nav>

    <div class="app-container">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Threads</span>
                <button class="btn btn-primary" onclick="showCreateModal()"
                    style="padding: 6px 12px; font-size:0.8rem;">
                    <i class="fa-solid fa-plus" style="margin-right:6px;"></i> New
                </button>
            </div>
            <div class="thread-list" id="threadList">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- CENTER CHAT -->
        <main class="chat-area">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-comments" style="color:var(--text-muted);"></i>
                    <span id="chatTitle" class="chat-title">Select a Thread</span>
                </div>
                <button class="btn-icon" title="Clear Chat" onclick="clearChatUI()">
                    <i class="fa-solid fa-eraser"></i>
                </button>
            </div>

            <div class="messages-box" id="messagesBox">
                <div
                    style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color: var(--text-muted); opacity:0.7;">
                    <div style="background:#f1f5f9; padding:20px; border-radius:50%; margin-bottom:15px;">
                        <i class="fa-solid fa-comment-dots" style="font-size: 2.5rem; color:var(--secondary);"></i>
                    </div>
                    <p style="font-size:1.1rem; font-weight:500;">Ready to assist</p>
                    <p style="font-size:0.9rem;">Select a thread to start chatting with your PDF documents.</p>
                </div>
            </div>

            <div class="input-area">
                <button class="btn-icon" style="font-size:1.2rem;" title="Attach (Future Use)" disabled>
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..." disabled
                    onkeypress="handleEnter(event)">
                <button class="btn btn-primary btn-send" id="sendBtn" onclick="sendMessage()" disabled>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </main>

        <!-- RIGHT FILES PANEL -->
        <aside class="files-panel">
            <div class="files-header">
                <span class="sidebar-title">Documents</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-icon" title="Upload PDF" onclick="triggerUpload()" id="uploadBtnIcon" disabled>
                        <i class="fa-solid fa-cloud-arrow-up" style="color:var(--primary); font-size:1.2rem;"></i>
                    </button>
                </div>
                <input type="file" id="fileInput" class="hidden" onchange="handleFileUpload(this)">
            </div>
            <div class="file-list" id="fileList">
                <!-- Populated by JS -->
            </div>
        </aside>

    </div>

    <!-- CREATE MODAL -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h3>Create New Thread</h3>
            <label style="font-size: 0.9rem; font-weight:600; color:var(--text-main);">Thread Name</label>
            <input type="text" id="newThreadName" class="form-input" placeholder="e.g. Project Alpha Specs">

            <label style="font-size: 0.9rem; font-weight:600; color:var(--text-main);">Parent Thread (Optional)</label>
            <select id="parentSelect" class="form-input" style="background:white;">
                <option value="">None (Top Level)</option>
            </select>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top:10px;">
                <button class="btn" style="background:#e2e8f0; color:var(--text-main);"
                    onclick="document.getElementById('createModal').style.display='none'">Cancel</button>
                <button class="btn btn-primary" onclick="createThread()">Create Thread</button>
            </div>
        </div>
    </div>

    <script>
        let currentThreadId = null;
        let threadsData = [];

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchThreads();
        });

        // --- API Interactions ---
        async function fetchThreads() {
            try {
                const res = await fetch('/api/list-threads/');
                const data = await res.json();
                threadsData = data.threads;
                renderThreads();
                updateParentDropdown();
            } catch (e) { console.error("Error fetching threads:", e); }
        }

        async function loadThreadContext(threadId, threadName) {
            currentThreadId = threadId;
            document.getElementById('chatTitle').innerText = threadName;

            // Enable Controls
            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('uploadBtnIcon').disabled = false;

            // Focus input
            document.getElementById('chatInput').focus();

            // UI Updates
            document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`t-${threadId}`);
            if (activeEl) activeEl.classList.add('active');

            // Load Files
            fetchFiles(threadId);

            // Load Chat History (Replacing the Reset logic with History logic or simple welcome if empty)
            loadChatHistory(threadId);
        }

        async function fetchFiles(threadId) {
            const res = await fetch(`/api/files/${threadId}/`);
            const data = await res.json();
            renderFiles(data.files, data.thread_name);
        }

        async function createThread() {
            const name = document.getElementById('newThreadName').value;
            const parentId = document.getElementById('parentSelect').value;

            if (!name) return;

            await fetch('/api/create-thread/', {
                method: 'POST',
                body: JSON.stringify({ name: name, parent_id: parentId || null })
            });

            document.getElementById('createModal').style.display = 'none';
            document.getElementById('newThreadName').value = '';
            fetchThreads();
        }

        // --- File Upload ---
        function triggerUpload() {
            console.log("Triggering upload click...");
            const input = document.getElementById('fileInput');
            if (input) {
                input.click();
            } else {
                console.error("File input element not found!");
                alert("Error: File upload input missing.");
            }
        }

        async function handleFileUpload(input) {
            if (!currentThreadId || !input.files[0]) return;

            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            // Optimistic UI Update
            const fileList = document.getElementById('fileList');
            fileList.insertAdjacentHTML('afterbegin', `
            <div class="file-card" id="uploading-temp" style="opacity: 0.7;">
                <i class="fa-solid fa-spinner fa-spin file-icon"></i>
                <div class="file-info"><div class="file-name">Uploading ${file.name}...</div></div>
            </div>
        `);

            try {
                const res = await fetch(`/api/upload/${currentThreadId}/`, { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    alert(`Upload Successful!\nDivided into ${data.chunk_count} chunks.`);
                    fetchFiles(currentThreadId); // Refresh list
                } else {
                    alert('Upload failed: ' + (data.error || 'Unknown error'));
                    document.getElementById('uploading-temp').remove();
                }
            } catch (e) {
                alert("Upload failed");
                document.getElementById('uploading-temp').remove();
            }
            input.value = ''; // Reset
        }

        // --- Chat Logic ---
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentThreadId) return;

            // 1. Add User Message
            appendMessage('user', text);
            input.value = '';

            // 2. Show Loading
            const loadingId = appendLoading();

            try {
                const res = await fetch(`/api/chat/${currentThreadId}/`, {
                    method: 'POST',
                    body: JSON.stringify({ query: text })
                });
                const data = await res.json();

                // 3. Remove Loading & Add AI Response
                removeMessage(loadingId);
                appendMessage('ai', data.answer, data.sources);
            } catch (e) {
                removeMessage(loadingId);
                appendMessage('ai', "Error connecting to AI service.");
            }
        }

        async function loadChatHistory(threadId) {
            const box = document.getElementById('messagesBox');
            box.innerHTML = ''; // Clear previous messages

            try {
                const res = await fetch(`/api/chat/history/${threadId}/`);
                if (!res.ok) throw new Error("Failed to load history");

                const data = await res.json();

                if (data.messages && data.messages.length > 0) {
                    // If history exists, render it
                    data.messages.forEach(msg => {
                        appendMessage(msg.role, msg.content, msg.sources || []);
                    });
                    // Scroll to bottom after loading
                    box.scrollTop = box.scrollHeight;
                } else {
                    // Empty state if no messages
                    box.innerHTML = `
                <div class="message ai">
                    <div class="bubble">
                        Hello! I'm ready to answer questions about documents in <b>${document.getElementById('chatTitle').innerText}</b>.
                    </div>
                </div>`;
                }
            } catch (e) {
                console.error("Error loading chat history:", e);
                box.innerHTML = `
            <div class="message ai">
                <div class="bubble" style="color:red;">
                    Failed to load chat history.
                </div>
            </div>`;
            }
        }

        // --- Render Helpers ---
        function renderThreads() {
            const container = document.getElementById('threadList');
            container.innerHTML = '';

            threadsData.forEach(parent => {
                const pDiv = document.createElement('div');
                pDiv.className = 'thread-item';
                pDiv.id = `t-${parent.id}`;
                // Refined HTML structure for rendering with classes
                pDiv.innerHTML = `
                <div class="thread-content">
                    <span><i class="fa-solid fa-folder" style="color:var(--text-muted); margin-right:8px;"></i> ${parent.name}</span>
                    <button class="btn-icon btn-delete" onclick="deleteThread(event, '${parent.id}')" title="Delete Thread">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;
                pDiv.onclick = (e) => {
                    // Ignore if clicked on delete button/icon
                    if (e.target.closest('.btn-delete')) return;
                    loadThreadContext(parent.id, parent.name);
                };
                container.appendChild(pDiv);

                parent.sub_threads.forEach(sub => {
                    const sDiv = document.createElement('div');
                    sDiv.className = 'thread-item sub-thread';
                    sDiv.id = `t-${sub.id}`;
                    sDiv.innerHTML = `
                    <div class="thread-content">
                        <span><i class="fa-solid fa-turn-up" style="transform: rotate(90deg); margin-right:8px; color:var(--text-muted);"></i> ${sub.name}</span>
                        <button class="btn-icon btn-delete" onclick="deleteThread(event, '${sub.id}')" title="Delete Thread">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                    sDiv.onclick = (e) => {
                        if (e.target.closest('.btn-delete')) return;
                        loadThreadContext(sub.id, sub.name);
                    };
                    container.appendChild(sDiv);
                });
            });
        }

        function renderFiles(files, currentName) {
            const container = document.getElementById('fileList');
            container.innerHTML = '';

            if (files.length === 0) {
                container.innerHTML = `
                <div style="text-align:center; padding:40px 20px; color:var(--text-muted);">
                    <i class="fa-solid fa-folder-open" style="font-size:2rem; margin-bottom:10px; opacity:0.5;"></i>
                    <p style="font-size:0.9rem; margin:0;">No documents yet.</p>
                </div>`;
                return;
            }

            files.forEach(file => {
                const inheritedHtml = file.is_inherited
                    ? `<span class="inherited-tag" title="Inherited from ${file.source_thread}">Parent</span>`
                    : '';

                // Updated HTML structure with classes
                const html = `
                <div class="file-card">
                    <i class="fa-solid fa-file-pdf file-icon"></i>
                    <div class="file-info">
                        <div class="file-name" title="${file.name}">${file.name} ${inheritedHtml}</div>
                        <div class="file-origin">From: ${file.is_inherited ? file.source_thread : 'Current Thread'}</div>
                    </div>
                    <a href="${file.url}" target="_blank" class="btn-icon" title="Download">
                        <i class="fa-solid fa-download"></i>
                    </a>
                    ${!file.is_inherited ? `
                        <button class="btn-icon btn-delete" onclick="deleteFile('${file.id}')" title="Delete File">
                            <i class="fa-solid fa-trash"></i>
                        </button>`
                        : ''}
                </div>
            `;
                container.innerHTML += html;
            });
        }

        function appendMessage(role, text, sources = []) {
            const box = document.getElementById('messagesBox');
            let sourceHtml = '';

            if (sources && sources.length > 0) {
                sourceHtml = `<div class="source-citation"><strong>Sources:</strong> ${sources.map(s => `<span class="source-item">${s}</span>`).join('')}</div>`;
            }

            const html = `
            <div class="message ${role}">
                <div class="bubble">
                    ${text.replace(/\n/g, '<br>')}
                    ${sourceHtml}
                </div>
            </div>
        `;
            box.insertAdjacentHTML('beforeend', html);
            // Smooth scroll
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        }

        function appendLoading() {
            const id = 'msg-' + Date.now();
            const box = document.getElementById('messagesBox');
            box.insertAdjacentHTML('beforeend', `
            <div class="message ai" id="${id}">
                <div class="bubble" style="color:var(--text-muted); font-style:italic;">
                    <i class="fa-solid fa-circle-notch fa-spin" style="margin-right:8px;"></i> AI is thinking...
                </div>
            </div>
        `);
            box.scrollTop = box.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function updateParentDropdown() {
            const select = document.getElementById('parentSelect');
            select.innerHTML = '<option value="">None (Top Level)</option>';
            threadsData.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                select.appendChild(opt);
            });
        }

        function showCreateModal() { document.getElementById('createModal').style.display = 'flex'; }
        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function clearChatUI() {
            document.getElementById('messagesBox').innerHTML = `
            <div class="message ai">
                <div class="bubble">Context cleared. Start a fresh conversation.</div>
            </div>`;
        }

        // --- Delete Functions ---
        async function deleteThread(event, threadId) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this thread? This will delete all sub-threads and documents within it!")) return;

            try {
                const res = await fetch(`/api/delete-thread/${threadId}/`, { method: 'DELETE' });
                if (res.ok) {
                    if (currentThreadId == threadId) {
                        currentThreadId = null;
                        document.getElementById('chatTitle').innerText = "Select a Thread";
                        document.getElementById('chatInput').disabled = true;
                        document.getElementById('sendBtn').disabled = true;
                        document.getElementById('uploadBtnIcon').disabled = true;
                        document.getElementById('fileList').innerHTML = '';
                        document.getElementById('messagesBox').innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color: var(--text-muted); opacity:0.7;">
                        <div style="background:#f1f5f9; padding:20px; border-radius:50%; margin-bottom:15px;">
                            <i class="fa-solid fa-comment-dots" style="font-size: 2.5rem; color:var(--secondary);"></i>
                        </div>
                        <p style="font-size:1.1rem; font-weight:500;">Ready to assist</p>
                    </div>`;
                    }
                    fetchThreads();
                } else {
                    const data = await res.json();
                    alert("Failed to delete thread: " + (data.error || res.statusText));
                }
            } catch (e) { console.error(e); alert("Error deleting thread: " + e.message); }
        }

        async function deleteFile(docId) {
            if (!confirm("Are you sure you want to delete this document?")) return;

            try {
                const res = await fetch(`/api/delete-document/${docId}/`, { method: 'DELETE' });
                if (res.ok) {
                    fetchFiles(currentThreadId);
                } else {
                    const data = await res.json();
                    alert("Failed to delete document: " + (data.error || res.statusText));
                }
            } catch (e) { console.error(e); alert("Error deleting document: " + e.message); }
        }

    </script>
</body>

</html>
